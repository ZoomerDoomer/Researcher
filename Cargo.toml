[workspace]
members = [
    "crates/bitcoin-source",
    "crates/chain-indexer",
    "crates/indexer-core",
    "crates/storage-redb",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
bitcoin = { version = "0.32.102", features = ["serde"] }
bitcoincore-rpc = "0.19.0"
redb = "4.2.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.23.0"
thiserror = "2.0"
